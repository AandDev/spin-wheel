<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título, favicon, logos, textos y colores se toman de CONFIG en js/script.js.
       Para personalizar la ruleta no hace falta editar este archivo. -->
  <title>Ruleta de premios</title>
  <link rel="icon" id="favicon" href="assets/img/logo-favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Barra de navegación ===== -->
  <header class="navbar">
    <div class="navbar__marca">
      <img id="logo-nav" class="navbar__logo" src="" alt="Logo">
      <span id="texto-nav" class="navbar__texto"></span>
    </div>
    <div class="navbar__acciones">
      <!-- Botones de sonido y pantalla completa (icono y textos se ponen desde js/script.js) -->
      <button id="btn-sonido" class="btn-icono" type="button"></button>
      <button id="btn-fullscreen" class="btn-icono" type="button"></button>
    </div>
  </header>

  <!-- ===== Zona principal: la rueda ===== -->
  <main class="principal">
    <div class="rueda" id="rueda">
      <!-- Puntero fijo arriba -->
      <div class="rueda__puntero" id="puntero"></div>
      <!-- La rueda se dibuja en este canvas y es lo único que gira -->
      <canvas id="canvas-rueda" class="rueda__canvas"></canvas>
      <!-- Círculo central con el logo (no gira) -->
      <div class="rueda__centro">
        <img id="logo-rueda" class="rueda__logo" src="" alt="Logo">
      </div>
    </div>

    <button id="btn-girar" class="btn-girar" type="button"></button>
  </main>

  <!-- ===== Pop-up de resultado (textos desde CONFIG.popup) ===== -->
  <div id="popup" class="popup" hidden>
    <div class="popup__caja" role="dialog" aria-modal="true" aria-labelledby="popup-titulo">
      <div id="popup-icono" class="popup__icono" aria-hidden="true"></div>
      <h2 id="popup-titulo" class="popup__titulo"></h2>
      <p id="popup-texto" class="popup__texto"></p>
      <p id="popup-premio" class="popup__premio"></p>
      <button id="btn-cerrar" class="btn-girar popup__cerrar" type="button"></button>
    </div>
  </div>

  <!-- Librería de confeti (única dependencia externa). Si no hay internet, la ruleta funciona sin confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
